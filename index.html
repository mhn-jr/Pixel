<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onella Nelora Lite</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; --bg: #05070c; --card: #0d1320; --line: #1c2740; --txt: #e6e9ef; --mut: #7c8aa0; --up: #2ecc8f; --dn: #ff5d6c; --acc: #f06a15;
    /* v1.2.2 — پالت مینیمال (دستور مالک ۲۰۲۶-۱۱-۰۹): رنگ‌های مکملِ کم‌اشباع با
       نقش ثابت؛ نارنجی همچنان برند و رنگ اصلی است، این‌ها فقط لهجه‌اند. */
    --p-trend: #7aa2d6; --p-mom: #a58fd6; --p-vol: #5fb8a6; --p-vola: #d6a55f; --p-lvl: #8fa3b8; --p-cndl: #d68a8a; --p-etf: #7fb98a; }
  * { box-sizing: border-box; }
  button { -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.97); }
  body { margin: 0; background: radial-gradient(640px 320px at 85% -5%, rgba(240,106,21,.10), transparent 60%), radial-gradient(520px 280px at 8% 0%, rgba(122,162,214,.07), transparent 60%), var(--bg); color: var(--txt); font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  header { padding: 12px 14px 6px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30; background: rgba(5,7,12,.88); backdrop-filter: blur(10px); }
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; direction: ltr; }
  header h1 img.logo { height: 26px; width: 26px; border-radius: 50%; }
  header h1 span { color: var(--acc); }
  header h1 span.lite { font-size: 11px; border: 1px solid var(--acc); border-radius: 999px; padding: 1px 7px; }
  #backBtn { background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  main { padding: 6px 14px 24px; max-width: 560px; margin: 0 auto; }
  .mkt { margin-top: 14px; }
  .mkt-h { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; border-inline-start: 3px solid var(--acc); padding-inline-start: 8px; }
  .mkt-h .mkt-ic { display: inline-flex; color: var(--acc); }
  .mkt-h .mkt-ic svg { width: 19px; height: 19px; }
  .syms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sym { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 10px 4px 9px; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 64px; justify-content: center; }
  .sym:active { border-color: var(--acc); }
  .sym-lb { line-height: 1.2; }
  .big { font-size: 30px; font-weight: 800; margin: 6px 0 2px; }
  .big-v { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .unit { font-size: 14px; font-weight: 400; color: var(--mut); margin-inline-start: 4px; }
  .sub { color: var(--mut); font-size: 13px; margin-bottom: 8px; }
  .up { color: var(--up); } .dn { color: var(--dn); }
  .rows { margin-top: 6px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row span { color: var(--mut); }
  .row b { font-weight: 600; text-align: end; }
  .muted { color: var(--mut); font-size: 13px; padding: 12px 0; }
  .na { color: var(--mut); font-size: 14px; padding: 16px 0; text-align: center; }
  .hint { color: #ffb347; font-size: 12px; padding: 6px 0; }
  .warn { color: #ffb347; font-size: 12px; padding: 10px 0; }
  /* v1.6.0 — تب‌های نماد: کنترل قطعه‌ای (segmented) با آیکون؛ فعال = گرادیان نارنجی. */
  .tabs { display: flex; gap: 3px; margin: 14px 0 4px; background: rgba(13,19,32,.75); border: 1px solid var(--line); border-radius: 13px; padding: 3px; }
  .tabs button { flex: 1; background: transparent; border: 0; color: var(--mut); border-radius: 10px; padding: 8px 2px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tabs button svg { width: 17px; height: 17px; }
  .tabs button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 4px 12px rgba(240,106,21,.35); }
  .seg { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .seg button { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .seg button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 3px 10px rgba(240,106,21,.3); }
  .chip { text-transform: capitalize; }
  .px { font-size: 14px; padding: 6px 2px; min-height: 24px; }
  .px b { margin-inline-start: 6px; }
  .chartwrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #cc { touch-action: none; }
  .news-item { padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .news-tag { font-size: 12px; margin-bottom: 4px; }
  .news-title { font-size: 14px; line-height: 1.6; }
  .news-time { color: var(--mut); font-size: 11px; margin-top: 4px; }
  .imp { font-size: 11px; }
  .imp.high { color: #ff5d6c; } .imp.med { color: #ffb347; } .imp.low { color: var(--mut); }
  /* v1.1.0 — سرچ (o-input اپ اصلی)، آیکون‌ها، نوار ابزار چارت، تمام‌صفحه، بج زنده */
  .o-input { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-top: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .o-input:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(240,106,21,.15); }
  .o-input svg { width: 18px; height: 18px; color: var(--mut); flex: none; }
  .o-input input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--txt); font-size: 14px; font-family: inherit; }
  .o-input input::placeholder { color: var(--mut); }
  .oa-ic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; font-size: 13px; font-weight: 700; }
  .oa-ic img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .oa-ic-letter { background: hsl(var(--h, 210) 60% 42%); color: #fff; }
  .oa-ic-fx img { width: 19px; height: 19px; border-radius: 50%; object-fit: cover; }
  .oa-ic-fx img + img { margin-inline-start: -7px; }
  .oa-ic-metal { font-size: 11px; }
  .oa-ic-gold { background: linear-gradient(135deg, #b8860b, #ffd700); color: #3a2a00; }
  .oa-ic-silver { background: linear-gradient(135deg, #8a93a3, #e8edf2); color: #333; }
  .oa-ic-platinum, .oa-ic-palladium, .oa-ic-copper { background: #1c2740; color: var(--acc); }
  .oa-ic-metal svg { width: 20px; height: 20px; }
  .sym-title-ic { display: inline-flex; vertical-align: -8px; margin-inline-end: 7px; }
  .sym-title-ic .oa-ic { width: 26px; height: 26px; }
  .srows { display: flex; flex-direction: column; }
  .srow { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; font-size: 14px; cursor: pointer; text-align: start; }
  .srow:active { border-color: var(--acc); }
  .srow-lb { font-weight: 700; }
  .srow-ds { color: var(--mut); font-size: 12px; }
  .toolbar { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .tbtn { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 11px; font-size: 12px; cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
  .tbtn.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 3px 10px rgba(240,106,21,.3); }
  .tbtn:active { border-color: var(--acc); }
  .live-dot { font-size: 11px; font-weight: 700; }
  .live-ws { color: var(--up); }
  .live-poll { color: #ffb347; }
  #tab-chart:fullscreen, #tab-chart.fs { background: var(--bg); padding: 12px; overflow-y: auto; }
  #tab-chart:fullscreen #nv, #tab-chart.fs #nv { height: calc(100dvh - 200px) !important; }
  #tab-chart:fullscreen #cc, #tab-chart.fs #cc { height: 100% !important; }
  /* v1.3.0 — جعبهٔ OHLC کراس‌هیر + پنل‌های RSI/MACD */
  .xh-box { position: absolute; top: 92px; right: 8px; z-index: 4; background: rgba(13,19,32,.88); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 11px; line-height: 1.7; color: var(--txt); pointer-events: none; text-align: left; white-space: nowrap; }
  .xh-box b { color: var(--txt); }
  .panes { margin-top: 8px; }
  .pane-row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
  .pane-h { display: flex; justify-content: space-between; padding: 6px 10px 0; font-size: 12px; color: var(--mut); }
  .pane-h b { color: var(--txt); font-weight: 700; }
  .pane-cv { width: 100%; height: 84px; display: block; touch-action: none; }
  /* v1.2.0 — دو تب اصلی (چارت / داشبورد) + مودال سرچ + گیج + داشبورد */
  main { padding-bottom: 84px; }
  /* v1.6.0 — کارت‌ها: سایهٔ نرم + هایلایت بالا؛ ناوبری پایین شیشه‌ای. */
  .sym, .srow, .dash-sec, .an-card, .fund-card, .news-card, .pane-row, .gauge, .sm-row { box-shadow: 0 6px 16px rgba(0,0,0,.28); background-image: linear-gradient(180deg, rgba(255,255,255,.025), transparent 45%); }
  #mainTabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(5,7,12,.88); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  #mainTabs button { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 12px; padding: 11px 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #mainTabs button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 4px 14px rgba(240,106,21,.35); }
  .dash-h { font-size: 16px; font-weight: 800; margin: 8px 0 10px; display: flex; align-items: center; justify-content: space-between; }
  .dash-h button { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .dash-sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .dash-sec h3 { margin: 0 0 10px; font-size: 14px; }
  .heat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .heat-row .heat-lb { width: 86px; flex: none; }
  .heat-bar { flex: 1; height: 10px; border-radius: 999px; background: #1c2740; overflow: hidden; display: flex; }
  .heat-bar .hb-up { background: var(--up); height: 100%; }
  .heat-bar .hb-dn { background: var(--dn); height: 100%; }
  .heat-row .heat-v { width: 64px; flex: none; text-align: end; font-weight: 700; }
  .mv-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--txt); padding: 9px 2px; font-size: 14px; cursor: pointer; text-align: start; }
  .mv-row:last-child { border-bottom: 0; }
  .mv-lb { font-weight: 700; }
  .mv-ds { color: var(--mut); font-size: 12px; }
  .mv-px { margin-inline-start: auto; text-align: end; }
  .mv-px b { display: block; }
  .mv-px span { font-size: 12px; font-weight: 700; }
  .gauge { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0 4px; }
  .gauge svg { flex: none; }
  .gauge .g-txt { font-size: 14px; font-weight: 700; }
  .gauge .g-sub { font-size: 12px; color: var(--mut); margin-top: 3px; line-height: 1.5; }
  /* مودال سرچ (مثل اپ اصلی: تمام‌صفحه، تب بازار، باکس بزرگ، ردیف آیکون‌دار + ستاره) */
  #searchModal { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: none; flex-direction: column; }
  #searchModal.open { display: flex; }
  .sm-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 6px; }
  .sm-top b { font-size: 16px; }
  .sm-top button { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
  .sm-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px 14px; scrollbar-width: none; }
  .sm-tabs::-webkit-scrollbar { display: none; }
  .sm-tabs button { flex: none; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
  .sm-tabs button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 3px 10px rgba(240,106,21,.3); }
  .sm-input { margin: 6px 14px 10px; }
  .sm-body { flex: 1; overflow-y: auto; padding: 0 14px 24px; }
  .sm-row { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; font-size: 14px; cursor: pointer; text-align: start; }
  .sm-row:active { border-color: var(--acc); }
  .sm-row .srow-lb { font-weight: 700; font-size: 15px; }
  .sm-row .srow-ds { color: var(--mut); font-size: 12px; margin-top: 2px; }
  .sm-star { margin-inline-start: auto; background: none; border: 0; font-size: 20px; cursor: pointer; color: #f5b446; padding: 2px 6px; }
  .sm-star.off { color: var(--mut); }
  .chart-tools { display: flex; gap: 6px; margin: 8px 0 4px; flex-wrap: wrap; }
  .chart-tools .tbtn.on { border-color: var(--acc); color: var(--acc); }
  .tool-note { font-size: 12px; color: var(--mut); line-height: 1.6; padding: 6px 2px; }
  .axis-btn { position: absolute; z-index: 5; background: #31415f; color: #fff; border: 0; border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #tvAutoBtn { top: 8px; inset-inline-end: 8px; }
  #tvLatestBtn { bottom: 8px; inset-inline-start: 8px; }
  /* نوار انتخاب نماد (مثل اپ اصلی: ▼ BTC/USDT + آیکون + ذره‌بین) */
  #symBar { display: flex; align-items: center; gap: 8px; width: 100%; background: linear-gradient(180deg, #111a2e, var(--card)); border: 1px solid var(--acc); color: var(--txt); border-radius: 12px; padding: 10px 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; text-align: start; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  #symBar .sym-bar-ic { display: inline-flex; }
  #symBar .sym-bar-ic .oa-ic { width: 26px; height: 26px; }
  #symBarTx { flex: 1; color: var(--acc); }
  #symBar .sym-bar-search { font-size: 16px; }
  #symBar .sym-bar-search svg { width: 18px; height: 18px; color: var(--mut); display: block; }
  /* v1.2.1 — قیمت روی چارت، آیکون SVG، کارت‌های تحلیل/بنیادی/خبر، دفتر سفارش */
  #mainTabs button { display: flex; align-items: center; justify-content: center; gap: 6px; }
  #mainTabs button svg { width: 18px; height: 18px; flex: none; }
  .dash-sec h3 { display: flex; align-items: center; gap: 7px; }
  .dash-sec h3 svg { width: 18px; height: 18px; color: var(--acc); flex: none; }
  .px-ov { position: absolute; top: 8px; inset-inline-start: 10px; z-index: 4; pointer-events: none; background: rgba(5,7,12,.6); border-radius: 7px; padding: 4px 8px; font-size: 13px; min-height: 0; }
  .px-ov b { font-size: 15px; }
  #lastPxTag { position: absolute; z-index: 4; right: 0; transform: translateY(-50%); background: var(--up); color: #04120b; font-size: 11px; font-weight: 800; border-radius: 4px 0 0 4px; padding: 3px 6px; pointer-events: none; white-space: nowrap; }
  #lastPxTag.dn { background: var(--dn); color: #fff; }
  .imp-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; }
  .imp-dot.high { background: #ff5d6c; } .imp-dot.med { background: #ffb347; } .imp-dot.low { background: var(--mut); }
  .an-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .an-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .an-card.wide { grid-column: 1 / -1; }
  .an-card h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .an-card h4 svg { width: 16px; height: 16px; color: var(--acc); flex: none; }
  /* v1.2.2 — پالت مینیمال: آیکون هر کارت تحلیل رنگ ثابت خودش را دارد. */
  .an-card.an-trend h4 svg { color: var(--p-trend); }
  .an-card.an-mom h4 svg { color: var(--p-mom); }
  .an-card.an-vola h4 svg { color: var(--p-vola); }
  .an-card.an-vol h4 svg { color: var(--p-vol); }
  .an-card.an-cndl h4 svg { color: var(--p-cndl); }
  .an-card.an-lvl h4 svg { color: var(--p-lvl); }
  /* v1.2.2 — نقطهٔ رنگ بازار (تب‌ها) + دکمهٔ شناور ابزارها + پنل ابزار روی چارت. */
  .mkt-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 2px; vertical-align: 1px; }
  .tools-fab { position: absolute; left: 8px; top: 44px; width: 44px; height: 44px; padding: 7px; background: rgba(13,19,32,.88); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; z-index: 5; }
  .tools-fab svg { width: 28px; height: 28px; display: block; }
  .tools-fab:active { border-color: var(--acc); }
  /* v1.5.0 — نوار ابزار عمودی (جای پنل بزرگ پایین چارت): باریک، قابل اسکرول؛
     دکمهٔ تنظیمات چارت (بالا-راست چارت، مثل اپ اصلی) + پنل تنظیمات قابل اسکرول. */
  .tools-strip { display: none; position: absolute; left: 8px; top: 96px; bottom: 8px; width: 48px; overflow-y: auto; overflow-x: hidden; background: rgba(13,19,32,.97); border: 1px solid var(--line); border-radius: 12px; padding: 4px; z-index: 6; }
  .tools-strip.open { display: block; }
  .tools-strip::-webkit-scrollbar { width: 4px; }
  .tools-strip::-webkit-scrollbar-thumb { background: rgba(124,138,160,.5); border-radius: 2px; }
  .strip-group { display: flex; flex-direction: column; gap: 4px; }
  .strip-sep { height: 1px; background: var(--line); margin: 6px 2px; flex: none; }
  .tools-strip .tbtn { width: 100%; height: 40px; padding: 4px; display: flex; align-items: center; justify-content: center; flex: none; }
  .tools-strip .tbtn svg { width: 22px; height: 22px; display: block; }
  .tools-strip #chartTools .tbtn.on { border-color: var(--p-vol); color: var(--p-vol); }
  .tools-strip #drawTools .tbtn.on { border-color: var(--acc); color: var(--acc); }
  .tools-strip .tbtn:disabled { opacity: .4; }
  .tool-note-bar { font-size: 12px; color: var(--mut); line-height: 1.6; padding: 6px 2px 0; }
  .set-fab { position: absolute; right: 8px; top: 48px; width: 36px; height: 36px; padding: 6px; background: rgba(13,19,32,.88); border: 1px solid var(--acc); border-radius: 10px; cursor: pointer; z-index: 5; }
  .set-fab svg { width: 22px; height: 22px; display: block; }
  .set-fab.on { background: rgba(240,106,21,.18); }
  /* v1.6.0 — تمام‌صفحه: گوشهٔ بالا-راست چارت (بالای دکمهٔ تنظیمات)؛ پنل تنظیمات کوچک‌تر. */
  .fs-fab { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; padding: 6px; background: rgba(13,19,32,.88); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; z-index: 5; color: var(--txt); }
  .fs-fab svg { width: 18px; height: 18px; display: block; }
  .settings-panel { display: none; position: absolute; top: 92px; right: 8px; width: 236px; max-width: calc(100% - 16px); max-height: 340px; overflow-y: auto; background: rgba(13,19,32,.97); border: 1px solid var(--line); border-radius: 12px; padding: 10px; z-index: 7; box-shadow: 0 10px 24px rgba(0,0,0,.45); }
  .settings-panel.open { display: block; }
  .settings-panel::-webkit-scrollbar { width: 4px; }

  .switch { width: 40px; height: 22px; border-radius: 11px; background: #2a3550; border: 1px solid var(--line); position: relative; cursor: pointer; flex: none; padding: 0; }
