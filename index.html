<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onella Nelora Lite</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; --bg: #05070c; --card: #0d1320; --line: #1c2740; --txt: #e6e9ef; --mut: #7c8aa0; --up: #2ecc8f; --dn: #ff5d6c; --acc: #f06a15;
    /* v1.2.2 — پالت مینیمال (دستور مالک ۲۰۲۶-۱۱-۰۹): رنگ‌های مکملِ کم‌اشباع با
       نقش ثابت؛ نارنجی همچنان برند و رنگ اصلی است، این‌ها فقط لهجه‌اند. */
    --p-trend: #7aa2d6; --p-mom: #a58fd6; --p-vol: #5fb8a6; --p-vola: #d6a55f; --p-lvl: #8fa3b8; --p-cndl: #d68a8a; --p-etf: #7fb98a; }
  * { box-sizing: border-box; }
  button { -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.97); }
  body { margin: 0; background: radial-gradient(640px 320px at 85% -5%, rgba(240,106,21,.10), transparent 60%), radial-gradient(520px 280px at 8% 0%, rgba(122,162,214,.07), transparent 60%), var(--bg); color: var(--txt); font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  header { padding: 12px 14px 6px; min-height: 46px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30; background: rgba(5,7,12,.88); backdrop-filter: blur(10px); }
  /* v1.14.8 — لوگو + نام دقیقاً وسط هدر (absolute + translate)؛ دکمهٔ بازگشت
     در جریان عادی می‌ماند و مرکز را جابه‌جا نمی‌کند. */
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; direction: ltr; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; white-space: nowrap; }
  /* v1.14.8 — پس‌زمینهٔ مینیمال هدر: مشکی + چند نقطهٔ کوچکِ درخشانِ آرام —
     کم‌تعداد، کوچک، کم‌نور، فقط transform/opacity (ارزان برای گوشی)؛
     با prefers-reduced-motion ثابت می‌مانند؛ هرگز روی متن نمی‌آیند. */
  .hdr-dots { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .hdr-dots i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(240,106,21,.55); box-shadow: 0 0 6px 2px rgba(240,106,21,.28); animation: hdrTw 7s ease-in-out infinite alternate; }
  .hdr-dots i:nth-child(1) { left: 10%; top: 28%; animation-delay: 0s; }
  .hdr-dots i:nth-child(2) { left: 24%; top: 68%; animation-delay: 1.2s; animation-duration: 8s; background: rgba(122,162,214,.5); box-shadow: 0 0 6px 2px rgba(122,162,214,.25); }
  .hdr-dots i:nth-child(3) { left: 76%; top: 26%; animation-delay: .6s; animation-duration: 6s; }
  .hdr-dots i:nth-child(4) { left: 88%; top: 66%; animation-delay: 2s; background: rgba(230,233,239,.45); box-shadow: 0 0 6px 2px rgba(230,233,239,.22); }
  .hdr-dots i:nth-child(5) { left: 46%; top: 78%; animation-delay: 1.6s; animation-duration: 9s; width: 2px; height: 2px; }
  .hdr-dots i:nth-child(6) { left: 62%; top: 18%; animation-delay: .3s; animation-duration: 7.5s; width: 2px; height: 2px; }
  @keyframes hdrTw { from { opacity: .15; transform: translate(0, 0); } to { opacity: .5; transform: translate(4px, -3px); } }
  @media (prefers-reduced-motion: reduce) { .hdr-dots i { animation: none; } }
  header h1 img.logo { height: 26px; width: 26px; border-radius: 50%; }
  header h1 span { color: var(--acc); }
  header h1 span.lite { font-size: 11px; border: 1px solid var(--acc); border-radius: 999px; padding: 1px 7px; }
  #backBtn { position: relative; z-index: 1; background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  main { padding: 6px 14px 24px; max-width: 560px; margin: 0 auto; }
  .mkt { margin-top: 14px; }
  .mkt-h { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; border-inline-start: 3px solid var(--acc); padding-inline-start: 8px; }
  .mkt-h .mkt-ic { display: inline-flex; color: var(--acc); }
  .mkt-h .mkt-ic svg { width: 19px; height: 19px; }
  .syms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sym { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 10px 4px 9px; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 64px; justify-content: center; }
  .sym:active { border-color: var(--acc); }
  .sym-lb { line-height: 1.2; }
  .big { font-size: 30px; font-weight: 800; margin: 6px 0 2px; }
  .big-v { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .unit { font-size: 14px; font-weight: 400; color: var(--mut); margin-inline-start: 4px; }
  .sub { color: var(--mut); font-size: 13px; margin-bottom: 8px; }
  .up { color: var(--up); } .dn { color: var(--dn); }
  .rows { margin-top: 6px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row span { color: var(--mut); }
  .row b { font-weight: 600; text-align: end; }
  .muted { color: var(--mut); font-size: 13px; padding: 12px 0; }
  .na { color: var(--mut); font-size: 14px; padding: 16px 0; text-align: center; }
  .hint { color: #ffb347; font-size: 12px; padding: 6px 0; }
  .warn { color: #ffb347; font-size: 12px; padding: 10px 0; }
  /* v1.6.0 — تب‌های نماد: کنترل قطعه‌ای (segmented) با آیکون؛ فعال = گرادیان نارنجی. */
  .tabs { display: flex; gap: 3px; margin: 14px 0 4px; background: rgba(13,19,32,.75); border: 1px solid var(--line); border-radius: 13px; padding: 3px; }
  .tabs button { flex: 1; background: transparent; border: 0; color: var(--mut); border-radius: 10px; padding: 8px 2px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tabs button svg { width: 17px; height: 17px; }
  .tabs button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 4px 12px rgba(240,106,21,.35); }
  .seg { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .seg button { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .seg button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 3px 10px rgba(240,106,21,.3); }
  .chip { text-transform: capitalize; }
  .px { font-size: 14px; padding: 6px 2px; min-height: 24px; }
  .px b { margin-inline-start: 6px; }
  .chartwrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
  /* v1.14.8 — کشیدنِ عمودی روی چارتِ اصلی صفحه را اسکرول می‌کند (فقط کشیدنِ
     افقی چارت را جابه‌جا می‌کند و فقط کشیدن روی محور قیمت مقیاس را می‌کشد). */
  #cc { touch-action: pan-y; }
  .news-item { padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .news-tag { font-size: 12px; margin-bottom: 4px; }
  .news-title { font-size: 14px; line-height: 1.6; }
  .news-time { color: var(--mut); font-size: 11px; margin-top: 4px; }
  .imp { font-size: 11px; }
  .imp.high { color: #ff5d6c; } .imp.med { color: #ffb347; } .imp.low { color: var(--mut); }
  /* v1.1.0 — سرچ (o-input اپ اصلی)، آیکون‌ها، نوار ابزار چارت، تمام‌صفحه، بج زنده */
  .o-input { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-top: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .o-input:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(240,106,21,.15); }
  .o-input svg { width: 18px; height: 18px; color: var(--mut); flex: none; }
  .o-input input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--txt); font-size: 14px; font-family: inherit; }
  .o-input input::placeholder { color: var(--mut); }
  .oa-ic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; font-size: 13px; font-weight: 700; }
  .oa-ic img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .oa-ic-letter { background: hsl(var(--h, 210) 60% 42%); color: #fff; }
  .oa-ic-fx img { width: 19px; height: 19px; border-radius: 50%; object-fit: cover; }
  .oa-ic-fx img + img { margin-inline-start: -7px; }
  .oa-ic-metal { font-size: 11px; }
  .oa-ic-gold { background: linear-gradient(135deg, #b8860b, #ffd700); color: #3a2a00; }
  .oa-ic-silver { background: linear-gradient(135deg, #8a93a3, #e8edf2); color: #333; }
  .oa-ic-platinum, .oa-ic-palladium, .oa-ic-copper { background: #1c2740; color: var(--acc); }
  .oa-ic-metal svg { width: 20px; height: 20px; }
  .sym-title-ic { display: inline-flex; vertical-align: -8px; margin-inline-end: 7px; }
  .sym-title-ic .oa-ic { width: 26px; height: 26px; }
  .srows { display: flex; flex-direction: column; }
  .srow { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; font-size: 14px; cursor: pointer; text-align: start; }
  .srow:active { border-color: var(--acc); }
  .srow-lb { font-weight: 700; }
  .srow-ds { color: var(--mut); font-size: 12px; }
  .tbtn { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 11px; font-size: 12px; cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
  .tbtn.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 3px 10px rgba(240,106,21,.3); }
  .tbtn:active { border-color: var(--acc); }
  .live-dot { font-size: 11px; font-weight: 700; }
  .live-ws { color: var(--up); }
  .live-poll { color: #ffb347; }
  /* v1.15.4 — تمام‌صفحه: ریشهٔ باگ این بود که .fs فقط رنگ/پدینگ می‌داد و هیچ‌وقت
     position:fixed نداشت (و مسیر تلگرام اصلاً کلاس نمی‌گذاشت)؛ پس چارت بزرگ نمی‌شد.
     حالا تمام‌صفحه همیشه یک لایهٔ ثابتِ تمام‌قد است (با بالا/پایینِ امنِ تلگرام و گوشی). */
  :root { --fs-top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px)); --fs-bot: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)); }
  body.fs-lock { overflow: hidden; }
  #tab-chart.fs { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; box-sizing: border-box; background: var(--bg); padding: calc(var(--fs-top) + 8px) 10px calc(var(--fs-bot) + 8px); overflow-y: auto; overscroll-behavior: contain; }
  #tab-chart.fs #nv { height: max(260px, calc(100dvh - var(--fs-top) - var(--fs-bot) - 200px)) !important; }
  #tab-chart.fs #cc { height: 100% !important; }
  /* v1.3.0 — جعبهٔ OHLC کراس‌هیر + پنل‌های RSI/MACD */
  .xh-box { position: absolute; top: 44px; right: 8px; z-index: 4; background: rgba(13,19,32,.92); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 11px; line-height: 1.7; color: var(--txt); pointer-events: none; text-align: left; max-width: calc(100% - 20px); }
  .xh-box b { color: var(--txt); }
  .panes { margin-top: 8px; }
  /* v1.9.0 — هشدار (به سبک تریدینگ‌ویو): دیالوگ، بنر، منوی محور قیمت، بج دکمه.
     v1.14.8 — بج آلرت روی دکمهٔ Alert نوار بالا نشست (دکمهٔ پایین حذف شد). */
  .al-badge { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--acc); color: #fff; font-size: 10px; font-weight: 800; line-height: 15px; text-align: center; padding: 0 3px; }
  .al-banner { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 70; display: flex; align-items: center; gap: 8px; background: #1a1408; border: 1px solid var(--acc); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--txt); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .al-banner .al-bell { color: var(--acc); flex: none; }
  .al-banner .al-bell svg { width: 18px; height: 18px; display: block; }
  .al-banner .al-bmsg { flex: 1; font-weight: 700; }
  .al-banner .al-bpx { color: var(--mut); font-size: 12px; white-space: nowrap; }
  .al-banner .al-bx { background: none; border: 0; color: var(--mut); font-size: 15px; cursor: pointer; padding: 2px 6px; }
  .axis-menu { position: fixed; z-index: 75; width: 220px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.55); }
  /* v1.9.1 — خط ردیابی قیمت روی محور (تک‌خط، هم‌قیمتِ برچسب قیمت آخر).
     v1.14.8 — برچسب + روی محور حذف شد؛ ⊕ حالا داخلِ همان برچسب قیمت آخر است. */
  .axis-track { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(240,106,21,.75); z-index: 3; pointer-events: none; }
  .axis-menu .ax-item { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: var(--txt); font-size: 13px; font-weight: 700; text-align: start; padding: 10px 8px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .axis-menu .ax-item:hover { background: rgba(240,106,21,.12); }
  .axis-menu .ax-item svg { width: 17px; height: 17px; color: var(--acc); flex: none; }
  .axis-menu .ax-ic { color: var(--acc); font-weight: 800; flex: none; width: 17px; text-align: center; }
  .al-modal { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
  .al-card { width: 100%; max-width: 480px; max-height: 88dvh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .al-top { display: flex; align-items: center; justify-content: space-between; font-size: 16px; margin-bottom: 4px; }
  .al-now { color: var(--mut); font-size: 13px; margin-bottom: 10px; }
  .al-lb { display: block; font-size: 13px; color: var(--mut); margin-bottom: 10px; }
  .al-in { display: block; width: 100%; box-sizing: border-box; margin-top: 5px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: var(--txt); font-size: 15px; font-family: inherit; padding: 10px 12px; outline: none; }
  .al-in:focus { border-color: var(--acc); }
  .al-note { color: var(--mut); font-size: 12px; line-height: 1.7; margin-bottom: 10px; }
  /* v1.10.0 — گزینهٔ «پیام تلگرام» در دیالوگ آلرت + نشان اشتراک در لیست. */
  .al-ck { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 6px; cursor: pointer; }
  .al-ck input { width: 18px; height: 18px; accent-color: var(--acc); flex: none; }
  .al-ck input:disabled + span { color: var(--mut); }
  .al-tgnote { color: var(--mut); font-size: 12px; line-height: 1.7; margin-bottom: 10px; }
  .al-tg { color: var(--acc); font-weight: 800; }
  .al-err { color: var(--dn); font-size: 13px; margin-bottom: 10px; }
  .al-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .al-actions .tbtn { flex: 1; padding: 11px; font-size: 14px; }
  .al-list-h { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
  .al-sec { color: var(--mut); font-size: 12px; margin: 10px 0 6px; }
  .al-row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; }
  .al-row-tx { flex: 1; min-width: 0; }
  .al-row-tx b { display: block; font-size: 13px; }
  .al-row-tx span { font-size: 12px; color: var(--mut); }
  .al-row-bt { display: flex; gap: 6px; flex: none; }
  .al-row-bt .tbtn { padding: 5px 9px; font-size: 12px; }
  .pane-row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
  .pane-h { display: flex; justify-content: space-between; padding: 6px 10px 0; font-size: 12px; color: var(--mut); }
  .pane-h b { color: var(--txt); font-weight: 700; }
  /* v1.14.8 — کشیدنِ عمودی روی پنل‌های اندیکاتور صفحه را اسکرول می‌کند
     (فقط کشیدنِ افقی کراس‌هیر را می‌برد). */
  .pane-cv { width: 100%; height: 84px; display: block; touch-action: pan-y; }
  /* v1.2.0 — دو تب اصلی (چارت / داشبورد) + مودال سرچ + گیج + داشبورد */
  main { padding-bottom: 84px; }
  /* v1.6.0 — کارت‌ها: سایهٔ نرم + هایلایت بالا؛ ناوبری پایین شیشه‌ای. */
  .sym, .srow, .dash-sec, .an-card, .fund-card, .news-card, .pane-row, .gauge, .sm-row { box-shadow: 0 6px 16px rgba(0,0,0,.28); background-image: linear-gradient(180deg, rgba(255,255,255,.025), transparent 45%); }
  #mainTabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(5,7,12,.88); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  #mainTabs button { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 12px; padding: 11px 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #mainTabs button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, #f06a15, #ff8a1f); box-shadow: 0 4px 14px rgba(240,106,21,.35); }
  .dash-h { font-size: 16px; font-weight: 800; margin: 8px 0 10px; display: flex; align-items: center; justify-content: space-between; }
  .dash-h button { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .dash-sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .dash-sec h3 { margin: 0 0 10px; font-size: 14px; }
  .heat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .heat-row .heat-lb { width: 86px; flex: none; }
  .heat-bar { flex: 1; height: 10px; border-radius: 999px; background: #1c2740; overflow: hidden; display: flex; }
  .heat-bar .hb-up { background: var(--up); height: 100%; }
  .heat-bar .hb-dn { background: var(--dn); height: 100%; }
  .heat-row .heat-v { width: 64px; flex: none; text-align: end; font-weight: 700; }
  /* v1.12.0 — ردیف‌های خلاصهٔ بازار: برچسب راست، مقدار چپ (قیمت + تغییر). */
  .dg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .dg-row .dg-v { font-weight: 700; text-align: end; }
  /* v1.12.1 — بازطراحی خلاصه: هیرو با نوار حال بازار، کارت‌های قیمت سرخط،
     و ردیف «حال هر بازار» با نوار breadth. */
  .dg-hero { text-align: center; padding: 6px 0 2px; }
  .dg-hero-mood { font-size: 24px; font-weight: 800; }
  .dg-hero-avg { font-size: 13px; color: var(--mut); margin-top: 2px; }
  .dg-bar { position: relative; height: 8px; border-radius: 99px; margin: 12px 4px 4px; background: linear-gradient(to left, var(--up), #e8c33c, var(--dn)); }
  .dg-marker { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--txt); border: 2px solid var(--bg); transform: translate(50%, -50%); }
  .dg-breadth { font-size: 12px; color: var(--mut); }

  .tools-fab, .set-fab { display: none; }

     دکمهٔ تنظیمات چارت (بالا-راست چارت، مثل اپ اصلی) + پنل تنظیمات قابل اسکرول. */
  /* v1.7.0 — پنل تنظیمات زیر دکمهٔ تنظیمات (سمت چپ) باز می‌شود؛ نوار ابزار
     دستی هم از همان سمت چپ، زیر ردیف بالا. */
  .tools-strip { display: none; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 176px; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; scrollbar-width: thin; background: rgba(13,19,32,.97); border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 34px; z-index: 6; }

  .strip-more { position: absolute; left: 8px; bottom: 8px; width: 176px; height: 30px; z-index: 7; display: block; background: var(--card); border: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 0 0 11px 11px; color: var(--mut); font-size: 12px; line-height: 1; cursor: pointer; padding: 0; }

  .tools-strip .tbtn svg { width: 20px; height: 20px; display: block; flex: none; }

  .set-sec-h { font-size: 11px; font-weight: 700; color: var(--mut); margin: 7px 0 4px; }

  /* v1.7.0 — چیدمان نوار بالا: تایم‌فریم + تمام‌صفحه سمت راست، ابزارهای دستی +
     تنظیمات چارت سمت چپ، وسط خالی (space-between؛ در RTL گروه اول راست است). */
  .tf-wrap { position: relative; margin: 10px 0 4px; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .tf-group { display: flex; gap: 6px; align-items: center; }

  /* v1.7.0 — دیزاین: حرکت نرم. تعویض تب با محو + بالا آمدن کوتاه؛ دکمه‌ها
     گذار رنگ/سایه دارند. */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #view-symbol .tabs, #gaugeBox, #symBar, #priceBox { animation: fadeIn .18s ease; }

  .sym, .srow, .sm-row, .mv-row { transition: border-color .15s ease, background-color .15s ease; }
  .tabs button, .seg button, #mainTabs button, .sm-tabs button, .tf-panel button { transition: background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .1s ease; }
  /* v1.7.0 — دیزاین: کارت‌ها عمیق‌تر. سربرگ هر کارت تحلیل یک نوار رنگِ نقش
     خودش را دارد (نه فقط آیکون)؛ کارت خلاصه و کارت تحلیل پیشرفته گرادیان ملایم
     نارنجی می‌گیرند تا قهرمان صفحه باشند. */
  .an-card { position: relative; overflow: hidden; }
  .an-card::before { content: ''; position: absolute; top: 0; inset-inline: 0; height: 3px; background: var(--line); border-radius: 3px 3px 0 0; }
  .an-card.an-trend::before { background: var(--p-trend); }
  .an-card.an-mom::before { background: var(--p-mom); }
  .an-card.an-vola::before { background: var(--p-vola); }
  .an-card.an-vol::before { background: var(--p-vol); }
  .an-card.an-cndl::before { background: var(--p-cndl); }
  .an-card.an-lvl::before { background: var(--p-lvl); }
  .an-card.an-sum::before { background: linear-gradient(90deg, var(--acc), #ff8a1f); }

  .an-card.an-verdict::before { background: linear-gradient(90deg, var(--acc), #ff8a1f); }
  .an-card.an-sum { background: linear-gradient(180deg, rgba(240,106,21,.06), rgba(13,19,32,0) 60%), var(--card); }

     (نه سه ردیف جدا) تا باکس قیمت جمع‌وجورتر شود. */
  .big { font-size: 34px; font-weight: 800; margin: 8px 0 2px; letter-spacing: .2px; }
  .px-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .px-stat { background: rgba(28,39,64,.55); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; }
  .px-stat .px-lb { font-size: 11px; color: var(--mut); }
  .px-stat .px-v { font-size: 14px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  /* v1.7.0 — دیزاین: گیج قهرمان‌تر — متن جهت بزرگ‌تر. */
  .gauge .g-txt { font-size: 15px; }
  .gauge { padding: 12px; border-color: rgba(240,106,21,.25); }
  /* v1.7.0 — دیزاین: خبر — خط رنگی تاثیر در سمت راست کارت (قرمز/زرد/خاکستری). */
  .news-card { border-inline-start: 3px solid var(--line); }
  .news-card.imp-high { border-inline-start-color: #ff5d6c; }
  .news-card.imp-med { border-inline-start-color: #ffb347; }
  /* v1.7.0 — دیزاین: داشبورد — سطرهای صعودی/نزولی با بازخورد لمسی. */
  .mv-row { border-radius: 8px; padding: 9px 8px; }
  .mv-row:active { background: rgba(28,39,64,.6); }
  /* v1.7.0 — دیزاین: ناوبری پایین — تب فعال یک نقطهٔ نارنجی زیر آیکون می‌گیرد. */
  #mainTabs button.on { position: relative; }
  #mainTabs button.on::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 16px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.85); }
  /* v1.7.0 — دیزاین: کاتولوگ — کارت نماد کمی بلندتر. */
  .sym { padding: 11px 4px 10px; }
  .sym .sym-px { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fund-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .fund-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .fund-card.wide { grid-column: 1 / -1; }
  .fund-card .fc-lb { font-size: 12px; color: var(--mut); }
  .fund-card .fc-v { font-size: 16px; font-weight: 800; margin-top: 3px; }
  .fund-card .fc-v small { font-size: 12px; font-weight: 400; color: var(--mut); }
  .news-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; }
  .news-card .news-tag { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .news-card .news-chip { background: #1c2740; border-radius: 999px; padding: 2px 8px; font-size: 11px; }
  .news-card .news-title { margin-top: 6px; }
  .ob-wrap { margin-top: 6px; }
  .ob-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .ob-head b { font-size: 15px; }
  .ob-head button { margin-inline-start: auto; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .ob-imb { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #1c2740; margin: 10px 0 4px; }
  .ob-imb .ib-bid { background: var(--up); height: 100%; }
  .ob-imb .ib-ask { background: var(--dn); height: 100%; }
  .ob-sub { font-size: 12px; color: var(--mut); text-align: center; }
  .ob-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 4px 8px; font-size: 11px; color: var(--mut); text-align: end; }
  .ob-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 4px 8px; font-size: 13px; position: relative; text-align: end; }
  .ob-row span { position: relative; z-index: 1; }
  .ob-row .ob-bar { position: absolute; top: 0; bottom: 0; inset-inline-end: 0; z-index: 0; }
  .ob-ask .ob-bar { background: rgba(255,93,108,.14); }
  .ob-bid .ob-bar { background: rgba(46,204,143,.14); }
  .ob-row .ob-p { font-weight: 700; }
  .ob-ask .ob-p { color: var(--dn); } .ob-bid .ob-p { color: var(--up); }
  .ob-spread { text-align: center; font-size: 12px; color: var(--mut); padding: 7px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 2px 0; }
  .sm-tabs button svg { width: 15px; height: 15px; vertical-align: -3px; }
  .sm-star svg { width: 20px; height: 20px; display: block; }
  /* v1.7.0 — معاملات زنده (تب عمق): ۲۰ معاملهٔ آخر از aggTrade. */
  .tr-sec { margin-top: 14px; }
  .tr-h { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 7px; border-inline-start: 3px solid var(--acc); padding-inline-start: 8px; }
  .tr-cols, .tr-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 4px 8px; font-size: 13px; text-align: end; }
  .tr-cols { font-size: 11px; color: var(--mut); }
  .tr-row { border-bottom: 1px solid rgba(120,140,170,.08); font-variant-numeric: tabular-nums; }
  .tr-row:last-child { border-bottom: 0; }
  .tr-row .tr-t { color: var(--mut); font-size: 12px; }
  .live-dot { font-size: 11px; font-weight: 700; }
  .live-dot.live-ws { color: var(--up); }
  .live-dot.live-poll { color: #ffb347; }
  /* v1.14.7 — دکمهٔ Alert کنار تنظیمات چارت (مثل تریدینگ‌ویو: آیکون ساعت + «Alert») */
  .tf-alert { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 6px 11px; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; cursor: pointer; flex: none; font-size: 12px; font-weight: 700; font-family: inherit; position: relative; }
  .tf-alert svg { width: 17px; height: 17px; display: block; }
  .tf-alert:active { border-color: var(--acc); }
  /* v1.14.7 — نوار وضعیت پایین چارت: ساعت زنده + منطقهٔ زمانی (مثل تریدینگ‌ویو). */
  .chart-status { display: flex; justify-content: flex-end; margin-top: 6px; }
  #tzClockBtn { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 11px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; cursor: pointer; font-family: inherit; }
  #tzClockBtn:active { border-color: var(--acc); }
  /* v1.14.7 — انتخاب‌گر منطقهٔ زمانی (لیست بلند + جستجو، مثل تریدینگ‌ویو). */
  .tz-list { max-height: 52dvh; overflow-y: auto; overscroll-behavior: contain; margin-top: 6px; }
  .tz-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid rgba(120,140,170,.12); color: var(--txt); font-size: 14px; padding: 11px 4px; cursor: pointer; text-align: start; font-family: inherit; }
  .tz-row:active { background: rgba(240,106,21,.1); }
  .tz-row .tz-ck { width: 20px; flex: none; color: var(--acc); font-weight: 800; text-align: center; }
  .tz-row .tz-lb { direction: ltr; unicode-bidi: plaintext; }
  .tz-row .tz-fa { color: var(--mut); font-size: 12px; margin-inline-start: auto; }
  /* v1.14.7 — شیت پایین محور قیمت (فقط «افزودن هشدار»؛ بدون ردیف معامله/خط). */
  .sheet-row { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: start; margin-bottom: 8px; font-family: inherit; }
  .sheet-row:active { border-color: var(--acc); }
  .sheet-row svg { width: 18px; height: 18px; color: var(--acc); flex: none; }
  /* v1.14.8 — حالت تمرکز (فقط داخل تمام‌صفحه): همهٔ کرومِ صفحه پنهان می‌شود و
     فقط خودِ چارت می‌ماند (محور قیمت + کندل‌ها + برچسب قیمت آخر می‌مانند؛
     فقط ⊕ برچسب پنهان می‌شود). خروج با دکمهٔ شناور؛ خروج از تمام‌صفحه هم
     تمرکز را خاموش می‌کند. */
  body.focus-mode header,
  body.focus-mode #mainTabs,
  body.focus-mode #view-symbol .tabs,
  body.focus-mode #symBar,
  body.focus-mode #priceBox,
  body.focus-mode #gaugeBox,
  body.focus-mode .tf-wrap,
  body.focus-mode #toolsStrip,
  body.focus-mode .strip-more,
  body.focus-mode .panes,
  body.focus-mode .chart-status,
  body.focus-mode .tool-note-bar { display: none !important; }
  body.focus-mode #lastPxTag .ax-plus { display: none !important; }
  body.focus-mode #tab-chart.fs { overflow: hidden; padding-top: calc(var(--fs-top) + 4px); padding-bottom: calc(var(--fs-bot) + 4px); }
  body.focus-mode #tab-chart.fs #nv { height: calc(100dvh - var(--fs-top) - var(--fs-bot) - 8px) !important; }
  #focusExitBtn { position: fixed; top: calc(var(--fs-top) + 10px); inset-inline-end: 10px; z-index: 65; background: rgba(13,19,32,.92); border: 1px solid var(--line); color: var(--txt); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  #focusExitBtn:active { border-color: var(--acc); }
  /* v1.14.8 — ردیف بزرگ‌نمایی در پنل تنظیمات (جایگزین دکمه‌های −/+ نوار پایین). */
  .set-zoom-row { display: flex; gap: 6px; }
  .set-zoom-row .tbtn { flex: 1; padding: 8px; font-size: 16px; font-weight: 800; text-align: center; }

  /* ===== v1.15.0 — پاس طراحی (override؛ برای برگشت، همین بلوک را حذف کن) ===== */
  /* پس‌زمینه: درز گرادیانِ ته صفحه از بین رفت؛ گرادیان به ویوپورت ثابت است. */
  html { background: var(--bg); min-height: 100%; }
  body { background-repeat: no-repeat; background-attachment: fixed; min-height: 100dvh; }
  /* هدر: بالای امن، خط نارنجیِ محو در لبهٔ پایین، لوگو دقیقاً وسط. */
  header { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; min-height: 56px; border-bottom: 1px solid transparent; background: linear-gradient(180deg, rgba(5,7,12,.94), rgba(5,7,12,.82)); }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(240,106,21,.45) 50%, transparent); pointer-events: none; }
  header h1 { top: calc(50% + env(safe-area-inset-top) / 2); font-size: 18px; letter-spacing: .2px; }
  header h1 img.logo { height: 28px; width: 28px; box-shadow: 0 0 0 1px rgba(240,106,21,.5), 0 0 14px rgba(240,106,21,.35); }
  header h1 span.lite { font-size: 10px; padding: 1px 7px; background: rgba(240,106,21,.12); }
  /* دکمهٔ بازگشت: فقط آیکون، گرد، شیشه‌ای، چسبیده به لبهٔ صفحه — کنار لوگو نمی‌چسبد. */
  #backBtn { width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(13,19,32,.85); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: border-color .15s, background .15s; }
  #backBtn[style*="display: none"] { display: none !important; }
  /* آیکون با CSS ساخته می‌شود و متنِ داخل دکمه (هر اسکریپتی که بنویسد) مخفی است؛ پس هرگز از دایره بیرون نمی‌زند. */
  #backBtn { font-size: 0 !important; line-height: 0; overflow: hidden; color: var(--txt); }
  #backBtn::before { content: ""; display: block; width: 20px; height: 20px; background: currentColor; -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M15 5l-7 7 7 7'/></svg>") center / contain no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M15 5l-7 7 7 7'/></svg>") center / contain no-repeat; }
  html[dir="rtl"] #backBtn::before { transform: scaleX(-1); }
  #backBtn:active { border-color: var(--acc); background: rgba(240,106,21,.14); }
  /* جستجو + تب‌های دسته: فاصلهٔ درست با عنوان زیرشان. */
  .o-input { margin-top: 6px; border-radius: 14px; background: linear-gradient(180deg, rgba(20,30,50,.9), var(--card)); }
  #catalogTabs { padding: 10px 0 8px !important; }
  #catalogTitle { margin-top: 12px; }
  .mkt-h { font-size: 15px; letter-spacing: .1px; }
  /* کارت نمادها: نور ملایم از بالا + حلقهٔ لمس نارنجی (به‌جای کارت‌های یکنواخت). */
  .sym { background: linear-gradient(180deg, rgba(24,34,56,.85), var(--card) 70%); border-radius: 14px; min-height: 72px; font-weight: 700; letter-spacing: .3px; transition: border-color .15s, box-shadow .15s, transform .1s; }
  .sym:active { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(240,106,21,.18), 0 6px 18px rgba(240,106,21,.15); }
  /* نوار پایین: شناور و شیشه‌ای، دکمه‌ها گردتر. */
  #mainTabs { left: 10px; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom)); padding: 6px; gap: 6px; border: 1px solid var(--line); border-radius: 20px; background: rgba(10,15,26,.82); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,.55); }
  #mainTabs button { border: 0; background: transparent; color: var(--mut); border-radius: 15px; padding: 12px 4px; display: flex; align-items: center; justify-content: center; gap: 7px; }
  #mainTabs button svg { width: 18px; height: 18px; }
  #mainTabs button.on { color: #fff; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  @media (prefers-reduced-motion: reduce) { .sym, #backBtn { transition: none; } }

  /* ===== v1.15.1 — پاس طراحی ۲: داشبورد، تحلیل، بنیادی، خبر، عمق (چارت دست‌نخورده) ===== */
  .dash-h { font-size: 20px; font-weight: 800; margin: 10px 0 12px; }
  .dash-h button { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(13,19,32,.85); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .dash-h button:active { border-color: var(--acc); background: rgba(240,106,21,.14); }
  /* کارت‌ها: یک زبان واحد — گوشهٔ ۱۶، نور ملایم از بالا، حاشیهٔ هم‌رنگ. */
  .dash-sec, .an-card, .gauge { border-radius: 16px; background: linear-gradient(180deg, rgba(22,32,54,.78), var(--card) 65%); }
  .dash-sec { padding: 14px; margin-bottom: 12px; }
  .dash-sec h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(28,39,64,.8); }
  .dash-sec h3 svg { width: 20px; height: 20px; }
  .an-card { padding: 13px 14px; }
  .an-card h4 { font-size: 13.5px; font-weight: 800; }
  .an-grid { gap: 10px; }
  .gauge { padding: 12px 14px; }
  /* خبر: هر خبر یک ردیف خوانا با فاصلهٔ بهتر. */
  .news-item { padding: 14px 4px; }
  .news-title { line-height: 1.75; font-size: 14.5px; }
  /* ردیف‌ها و حالت خالی. */
  .row { padding: 10px 2px; }
  .na, .muted { color: var(--mut); text-align: center; padding: 14px 8px; font-size: 13.5px; line-height: 1.8; }
  /* دکمه‌های قطعه‌ای (تایم‌فریم و …): قرصی‌تر. */
  .seg button { border-radius: 999px; padding: 7px 13px; font-weight: 700; transition: border-color .15s; }
  .seg button:active { border-color: var(--acc); }
  /* تب‌های نماد: قرص بزرگ‌تر و شیشه‌ای. */
  .tabs { border-radius: 18px; padding: 4px; background: rgba(10,15,26,.82); backdrop-filter: blur(10px); }
  .tabs button { border-radius: 14px; padding: 9px 2px; }
  /* انتخاب نماد بالای صفحهٔ نماد. */
  #priceBox, .px { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .seg button { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="hdr-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button id="backBtn" type="button" style="display:none" aria-label="بازگشت" title="بازگشت"></button>
  <h1><img class="logo" src="logo.png" alt="Onella Nelora Lite"> Onella <span>Nelora</span> <span class="lite">Lite</span></h1>
</header>
<main>
  <div id="view-catalog">
    <label class="o-input" id="searchTrigger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg><input id="searchInput" type="search" autocomplete="off" placeholder="جستجو…" readonly></label>
    <div class="sm-tabs" id="catalogTabs" style="padding:6px 0"></div>
    <div id="catalogTitle" class="mkt-h">کاتالوگ</div>
    <div id="catalog"></div>
    <div id="searchResults"></div>
  </div>
  <div id="view-symbol" style="display:none">
    <div id="gaugeBox"></div>
    <button id="symBar" type="button"><span class="sym-bar-ic" id="symBarIc"></span><span id="symBarTx">▼</span><span class="sym-bar-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg></span></button>
    <h2 id="symTitle" style="display:none"></h2>
    <div id="priceBox"></div>
    <div class="tabs">
      <button id="tabBtn-chart" type="button" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21h18"/><path d="M7 17v-6"/><path d="M12 17V7"/><path d="M17 17v-3"/></svg><span>چارت</span></button>
      <button id="tabBtn-analysis" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>تحلیل</span></button>
      <button id="tabBtn-fund" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg><span>بنیادی</span></button>
      <button id="tabBtn-news" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10"/><path d="M7 13h6"/></svg><span>خبر</span></button>
      <button id="tabBtn-depth" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>عمق</span></button>
    </div>
    <div id="tab-chart"></div>
    <div id="tab-analysis" style="display:none"></div>
    <div id="tab-fund" style="display:none"></div>
    <div id="tab-news" style="display:none"></div>
    <div id="tab-depth" style="display:none"></div>
  </div>
  <div id="view-dash" style="display:none">
    <div class="dash-h"><span id="dashTitle">داشبورد</span><button id="dashRefresh" type="button">↻</button></div>
    <div id="dashDigest"></div>
    <div id="dashHeat"></div>
    <div id="dashMovers"></div>
    <div id="dashNews"></div>
    <div id="dashNote" class="warn"></div>
  </div>
</main>
<nav id="mainTabs">
  <button id="mainTab-chart" type="button" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21h18"/><path d="M7 17v-6"/><path d="M12 17V7"/><path d="M17 17v-3"/></svg> چارت</button>
  <button id="mainTab-dash" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/></svg> داشبورد</button>
</nav>
<div id="searchModal" role="dialog" aria-modal="true" aria-label="search">
  <div class="sm-top"><b id="smTitle">جستجو</b><button id="smClose" type="button" aria-label="close">✕</button></div>
  <div class="sm-tabs" id="smTabs"></div>
  <label class="o-input sm-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg><input id="smInput" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="جستجو…"></label>
  <div class="sm-body" id="smBody"></div>
</div>
<script src="display-src.js"></script>
<script src="chart-style.js"></script>
<script src="chart-tools.js"></script>
<script src="native-chart.js"></script>
<script src="chart-draw.js"></script>
<script src="analysis-src.js"></script>
<script src="chart-panes.js"></script>
<script src="alerts-src.js"></script>
<script src="news-src.js"></script>
<script src="asset-icons.js"></script>
<script src="tz-src.js"></script>
<script src="app.js"></script>
</body>
</html>
