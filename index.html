<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onella Nelora Lite</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; --bg: #05070c; --card: #0d1320; --line: #1c2740; --txt: #e6e9ef; --mut: #7c8aa0; --up: #2ecc8f; --dn: #ff5d6c; --acc: #f06a15; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  header { padding: 12px 14px 6px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; direction: ltr; }
  header h1 img.logo { height: 26px; width: 26px; border-radius: 50%; }
  header h1 span { color: var(--acc); }
  header h1 span.lite { font-size: 11px; border: 1px solid var(--acc); border-radius: 999px; padding: 1px 7px; }
  #backBtn { background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  main { padding: 6px 14px 24px; max-width: 560px; margin: 0 auto; }
  .mkt { margin-top: 14px; }
  .mkt-h { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
  .mkt-h .mkt-ic { display: inline-flex; color: var(--acc); }
  .mkt-h .mkt-ic svg { width: 19px; height: 19px; }
  .syms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sym { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 10px 4px 9px; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 64px; justify-content: center; }
  .sym:active { border-color: var(--acc); }
  .sym-lb { line-height: 1.2; }
  .big { font-size: 28px; font-weight: 800; margin: 6px 0 2px; }
  .unit { font-size: 14px; font-weight: 400; color: var(--mut); margin-inline-start: 4px; }
  .sub { color: var(--mut); font-size: 13px; margin-bottom: 8px; }
  .up { color: var(--up); } .dn { color: var(--dn); }
  .rows { margin-top: 6px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row span { color: var(--mut); }
  .row b { font-weight: 600; text-align: end; }
  .muted { color: var(--mut); font-size: 13px; padding: 12px 0; }
  .na { color: var(--mut); font-size: 14px; padding: 16px 0; text-align: center; }
  .hint { color: #ffb347; font-size: 12px; padding: 6px 0; }
  .warn { color: #ffb347; font-size: 12px; padding: 10px 0; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 4px; }
  .tabs button { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 9px 2px; font-size: 13px; cursor: pointer; }
  .tabs button.on { border-color: var(--acc); color: var(--acc); }
  .seg { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .seg button { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .seg button.on { border-color: var(--acc); color: var(--acc); }
  .chip { text-transform: capitalize; }
  .px { font-size: 14px; padding: 6px 2px; min-height: 24px; }
  .px b { margin-inline-start: 6px; }
  .chartwrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #cc { touch-action: none; }
  .news-item { padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .news-tag { font-size: 12px; margin-bottom: 4px; }
  .news-title { font-size: 14px; line-height: 1.6; }
  .news-time { color: var(--mut); font-size: 11px; margin-top: 4px; }
  .imp { font-size: 11px; }
  .imp.high { color: #ff5d6c; } .imp.med { color: #ffb347; } .imp.low { color: var(--mut); }
  /* v1.1.0 — سرچ (o-input اپ اصلی)، آیکون‌ها، نوار ابزار چارت، تمام‌صفحه، بج زنده */
  .o-input { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-top: 10px; }
  .o-input:focus-within { border-color: var(--acc); }
  .o-input svg { width: 18px; height: 18px; color: var(--mut); flex: none; }
  .o-input input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--txt); font-size: 14px; font-family: inherit; }
  .o-input input::placeholder { color: var(--mut); }
  .oa-ic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; font-size: 13px; font-weight: 700; }
  .oa-ic img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .oa-ic-letter { background: hsl(var(--h, 210) 60% 42%); color: #fff; }
  .oa-ic-fx img { width: 19px; height: 19px; border-radius: 50%; object-fit: cover; }
  .oa-ic-fx img + img { margin-inline-start: -7px; }
  .oa-ic-metal { font-size: 11px; }
  .oa-ic-gold { background: linear-gradient(135deg, #b8860b, #ffd700); color: #3a2a00; }
  .oa-ic-silver { background: linear-gradient(135deg, #8a93a3, #e8edf2); color: #333; }
  .oa-ic-platinum, .oa-ic-palladium, .oa-ic-copper { background: #1c2740; color: var(--acc); }
  .oa-ic-metal svg { width: 20px; height: 20px; }
  .sym-title-ic { display: inline-flex; vertical-align: -8px; margin-inline-end: 7px; }
  .sym-title-ic .oa-ic { width: 26px; height: 26px; }
  .srows { display: flex; flex-direction: column; }
  .srow { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; font-size: 14px; cursor: pointer; text-align: start; }
  .srow:active { border-color: var(--acc); }
  .srow-lb { font-weight: 700; }
  .srow-ds { color: var(--mut); font-size: 12px; }
  .toolbar { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .tbtn { background: var(--card); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 11px; font-size: 12px; cursor: pointer; }
  .tbtn.on { border-color: var(--acc); color: var(--acc); }
  .tbtn:active { border-color: var(--acc); }
  .live-dot { font-size: 11px; font-weight: 700; }
  .live-ws { color: var(--up); }
  .live-poll { color: #ffb347; }
  #tab-chart:fullscreen, #tab-chart.fs { background: var(--bg); padding: 12px; }
  #tab-chart:fullscreen #nv, #tab-chart.fs #nv { height: calc(100dvh - 200px) !important; }
  #tab-chart:fullscreen #cc, #tab-chart.fs #cc { height: 100% !important; }
</style>
</head>
<body>
<header>
  <button id="backBtn" type="button" style="display:none">‹ بازگشت</button>
  <h1><img class="logo" src="logo.png" alt="Onella Nelora Lite"> Onella <span>Nelora</span> <span class="lite">Lite</span></h1>
</header>
<main>
  <div id="view-catalog">
    <label class="o-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg><input id="searchInput" type="search" autocomplete="off" placeholder="جستجو…"></label>
    <div id="catalogTitle" class="mkt-h">کاتولوگ</div>
    <div id="catalog"></div>
    <div id="searchResults"></div>
  </div>
  <div id="view-symbol" style="display:none">
    <h2 id="symTitle" style="font-size:18px;margin:4px 0 2px"></h2>
    <div id="priceBox"></div>
    <div class="tabs">
      <button id="tabBtn-chart" type="button" class="on">چارت</button>
      <button id="tabBtn-analysis" type="button">تحلیل</button>
      <button id="tabBtn-fund" type="button">بنیادی</button>
      <button id="tabBtn-news" type="button">خبر</button>
    </div>
    <div id="tab-chart"></div>
    <div id="tab-analysis" style="display:none"></div>
    <div id="tab-fund" style="display:none"></div>
    <div id="tab-news" style="display:none"></div>
  </div>
</main>
<script src="display-src.js"></script>
<script src="chart-style.js"></script>
<script src="chart-tools.js"></script>
<script src="native-chart.js"></script>
<script src="analysis-src.js"></script>
<script src="news-src.js"></script>
<script src="asset-icons.js"></script>
<script src="app.js"></script>
</body>
</html>
